<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Premium radial background gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#1A202C" />
      <stop offset="100%" stop-color="#07090E" />
    </radialGradient>
    
    <!-- Zcash Gold Gradient -->
    <linearGradient id="zecGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD043" />
      <stop offset="100%" stop-color="#F4B728" />
    </linearGradient>

    <!-- Subtle Outer Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#F4B728" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- High-contrast rounded badge background (works on dark AND light browser tabs) -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#bgGlow)" stroke="#F4B728" stroke-width="3" />

  <!-- Shielded cypherpunk core with Zcash Z -->
  <g filter="url(#glow)">
    <!-- Vertical currency strike lines -->
    <path d="M32 9 L32 17 M32 47 L32 55" stroke="url(#zecGold)" stroke-width="4.5" stroke-linecap="round" />

    <!-- Bold Zcash 'Z' character (thick, readable down to 16px) -->
    <path d="M19 19 L45 19 L21 45 L45 45" 
          fill="none" 
          stroke="url(#zecGold)" 
          stroke-width="5.5" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Whisper privacy dot accent -->
    <circle cx="47" cy="18" r="2.5" fill="#10B981" />
  </g>
</svg>